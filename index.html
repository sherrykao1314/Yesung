<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>圖鑑搬家公告</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Noto Sans TC', sans-serif;
      /* 寶藍色漸層背景 */
      background: linear-gradient(135deg, #0033a0 0%, #001a4d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px 25px;
      text-align: center;
      max-width: 350px;
      width: 85%;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
      line-height: 1;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 15px 0;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    p {
      font-size: 0.95rem;
      line-height: 1.7;
      margin: 0 0 30px 0;
      color: #e0e8ff;
      font-weight: 400;
    }

    .highlight {
      color: #ffd700;
      font-weight: 700;
    }

    .btn {
      display: inline-block;
      background: #ffffff;
      color: #0033a0;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
      background: #f0f4ff;
    }

    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">🚀</div>
    <h1>舊版網頁已關閉</h1>
    <p>為了提供更穩定的服務與專屬體驗，<br>圖鑑已經全面升級搬家囉！<br><br>請點擊下方按鈕移至新版網站，<span class="highlight">申請您的專屬帳號</span>，繼續使用完整圖鑑功能💙</p>
    
    <!-- 前往新網站的按鈕 -->
    <a href="https://sherrykao1314.github.io/CardIndex/" class="btn">前往新版圖鑑申請</a>
  </div>

</body>
</html>
